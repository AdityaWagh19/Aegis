name: Deploy Aegis to EC2

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/unit/ -v
        env:
          GROQ_API_KEY: test_key_not_used_in_unit_tests
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test_secret_key_32_chars_minimum_here
      - name: Run compliance gate tests
        run: pytest tests/unit/test_compliance_gate.py -v --tb=short
        env:
          GROQ_API_KEY: test_key_not_used_in_unit_tests
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test_secret_key_32_chars_minimum_here
      - name: Run integration tests (mocked externals)
        run: pytest tests/integration/ -v --tb=short
        env:
          GROQ_API_KEY: test_key_not_used_in_unit_tests
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test_secret_key_32_chars_minimum_here

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build React dashboard
        working-directory: ./dashboard
        run: |
          npm ci
          npm run build

      - name: Allow runner IP on SSH (temporary SG rule)
        run: |
          aws configure set region ap-south-1
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id sg-0a3f917df67b9698c \
            --protocol tcp --port 22 --cidr "${RUNNER_IP}/32" \
            --tag-specifications "ResourceType=security-group-rule,Tags=[{Key=Name,Value=aegis-ci-temp},{Key=ci-run,Value=${{ github.run_id }}}]"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_CI }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_CI }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Copy files to EC2 via rsync
        run: |
          rsync -avzr --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --exclude='data/synthetic.csv' \
            --exclude='data/synthetic_held_out.csv' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/Aegis/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/Aegis
            if [ -f alembic.ini ]; then docker compose run --rm api alembic upgrade head; fi
            docker compose up --build -d
            sudo systemctl reload nginx
            echo "Aegis deployed successfully"

      - name: Revoke temporary SSH rule (always)
        if: always()
        run: |
          aws configure set region ap-south-1
          RULE_IDS=$(aws ec2 describe-security-group-rules \
            --filters "Name=tag:ci-run,Values=${{ github.run_id }}" \
            --query "SecurityGroupRules[].SecurityGroupRuleId" --output text)
          for id in $RULE_IDS; do
            aws ec2 revoke-security-group-ingress \
              --group-id sg-0a3f917df67b9698c \
              --security-group-rule-ids "$id" && echo "Revoked $id"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_CI }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_CI }}
